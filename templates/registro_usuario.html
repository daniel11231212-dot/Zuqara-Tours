<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/registro_usuario.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/flash.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/componentes.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>

{% include "partials/flash.html" %}

<div class="container vh-100 d-flex justify-content-center align-items-center">

    <div class="caja-registro">

        <img src="{{ url_for('static', filename='img/Log.png') }}" class="logo-proyecto" alt="Logo">

        <h2 class="titulo">
            Crear Usuario
        </h2>

        <form action="{{ url_for('registro_usuario_post') }}" method="POST">

            <input
                type="text"
                name="nombre"
                class="form-control mb-3"
                placeholder="Nombre completo"
                required
            >

            <input
                type="date"
                name="fecha_nacimiento"
                class="form-control mb-3"
            >

            <input
                type="email"
                name="correo"
                class="form-control mb-3"
                placeholder="Correo electrónico"
                required
            >

            <input
                type="text"
                name="telefono"
                class="form-control mb-3"
                placeholder="Número de teléfono"
                inputmode="numeric"
                pattern="[0-9]{10}"
                maxlength="10"
                minlength="10"
                oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                required
            >

            <div class="campo-password-wrapper mb-3">
                <input
                    type="password"
                    id="password_registro"
                    name="password"
                    class="form-control"
                    placeholder="Contraseña"
                    required
                >

                <i
                    id="icono_password_registro"
                    class="bi bi-eye icono-alternar-password"
                    onclick="zuqaraAlternarPassword('password_registro', 'icono_password_registro')"
                ></i>
            </div>

            <div class="campo-password-wrapper mb-4">
                <input
                    type="password"
                    id="confirmar_password_registro"
                    name="confirmar_password"
                    class="form-control"
                    placeholder="Confirmar contraseña"
                    required
                >

                <i
                    id="icono_confirmar_password_registro"
                    class="bi bi-eye icono-alternar-password"
                    onclick="zuqaraAlternarPassword('confirmar_password_registro', 'icono_confirmar_password_registro')"
                ></i>
            </div>

            <button type="submit" class="btn boton-registrar w-100">
                Registrarme
            </button>

        </form>

        <div class="text-center mt-3">
            <a href="{{ url_for('registro') }}">← Volver</a>
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

{% include "components/alternar_password.html" %}

</body>

</html>
