<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zuqara Tours | Iniciar sesión</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/registro.css') }}">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/flash.css') }}">

</head>

<body>

{% include "partials/flash.html" %}

<div class="caja-seleccion">

    <img src="{{ url_for('static', filename='img/Log.png') }}"
         class="logo-proyecto"
         alt="Logo Zuqara">

    <h2 class="titulo-registro">
        Bienvenido a Zuqara Tours
    </h2>

    <p class="texto-registro">
        Elige cómo deseas ingresar a la plataforma para comenzar tu experiencia.
    </p>

    <div class="d-grid gap-3 mt-4">

        <a href="{{ url_for('login_usuario') }}"
           class="btn boton-usuario">

            <i class="bi bi-person-circle me-2"></i>

            Ingresar como Usuario

        </a>

        <a href="{{ url_for('login_empresa') }}"
           class="btn boton-empresa">

            <i class="bi bi-buildings me-2"></i>

            Ingresar como Empresa

        </a>

        <a href="{{ url_for('login_guia') }}"
           class="btn boton-guia">


            <i class="bi bi-person-badge-fill me-2"></i>

            Ingresar como Guía Turístico

        </a>

    </div>

    <hr>

    <div class="text-center">

        <a href="{{ url_for('registro') }}"
           class="volver-login">

            <i class="bi bi-person-plus"></i>

            Crear una cuenta

        </a>

    </div>

    <div class="text-center mt-3">

        <a href="{{ url_for('registro_guia') }}"
           class="crear-guia">

            <i class="bi bi-person-plus-fill me-1"></i>

            Crear cuenta de Guía Turístico

        </a>

    </div>

    <div class="text-center mt-4">

        <a href="{{ url_for('admin_login') }}"
           class="btn btn-outline-dark rounded-pill px-4 py-2">

            <i class="bi bi-shield-lock-fill me-2"></i>

            Panel Administrativo

        </a>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
