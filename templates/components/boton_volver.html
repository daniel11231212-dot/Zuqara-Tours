<button
    type="button"
    class="btn-volver-flotante"
    title="Volver"
    onclick="zuqaraVolver('{{ volver_fallback if volver_fallback else url_for('principal') }}')">
    <i class="bi bi-arrow-left"></i>
</button>

<script>
    function zuqaraVolver(destinoAlternativo) {
        if (window.history.length > 1 && document.referrer && document.referrer.indexOf(window.location.origin) === 0) {
            window.history.back();
        } else {
            window.location.href = destinoAlternativo;
        }
    }
</script>
