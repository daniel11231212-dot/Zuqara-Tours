<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/registro.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/flash.css') }}">
</head>
<body>

{% include "partials/flash.html" %}


<div class="container vh-100 d-flex justify-content-center align-items-center">

    <div class="caja-seleccion">
        
        <img src="{{ url_for('static', filename='img/Log.png') }}" alt="Logo" class="logo-proyecto">

        <h2 class="titulo-registro">
            ¿Qué deseas crear?
        </h2>

        <p class="texto-registro">
            Selecciona el tipo de cuenta que quieres registrar.
        </p>

        <div class="d-grid gap-3 mt-4">

            <a href="{{ url_for('registro_usuario') }}" class="btn boton-usuario">
                👤 Crear Usuario
            </a>

            <a href="{{ url_for('registro_empresa') }}" class="btn boton-empresa">
                🏢 Crear Empresa
            </a>

        </div>

        <div class="text-center mt-4">
            <a href="{{ url_for('index') }}" class="volver-login">
                ← Volver al Inicio de Sesión
            </a>
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
